<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Evolution Dashboard</title>
  <style>
    :root{--bg:#08090a;--panel:#0f1012;--surface:#15171a;--surface2:#1a1c20;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.05);--text:#f2f3f5;--sub:#b4b8c0;--muted:#747982;--green:#3ecf8e;--amber:#e7ad52;--red:#ef6b73;--blue:#6d9ff5;--cyan:#55c2d4;--radius:10px;--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;--mono:"SFMono-Regular","SF Mono",Menlo,Monaco,Consolas,monospace}
    *{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{color:inherit}button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
    .shell{max-width:1680px;margin:auto;padding:0 24px 48px}.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line2);margin-bottom:22px}.brand{display:flex;align-items:center;gap:11px}.mark{width:28px;height:28px;border:1px solid var(--line);border-radius:7px;display:grid;place-items:center;background:var(--surface);font:600 12px var(--mono);color:var(--green)}h1{font-size:16px;letter-spacing:-.15px;margin:0;font-weight:600}.eyebrow{font:10px var(--mono);letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-top:3px}.topmeta{display:flex;align-items:center;gap:16px;color:var(--muted);font:11px var(--mono)}.sync{display:flex;align-items:center;gap:7px}.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}.dot.ok{background:var(--green);box-shadow:0 0 0 3px rgba(62,207,142,.08)}
    .iconbtn,.btn{border:1px solid var(--line);background:rgba(255,255,255,.025);border-radius:6px;cursor:pointer}.iconbtn{width:32px;height:30px;font-size:16px}.iconbtn:hover,.btn:hover:not(:disabled){background:rgba(255,255,255,.065);border-color:rgba(255,255,255,.14)}.iconbtn:disabled,.btn:disabled{opacity:.42;cursor:not-allowed}
    .architecture{display:grid;grid-template-columns:1fr auto;gap:14px;margin-bottom:18px}.flow-card,.background-card{padding:15px}.flow-title{font-size:12px;font-weight:600;margin-bottom:10px}.flow{display:flex;align-items:stretch;gap:8px}.flow-step{flex:1;min-width:0;padding:11px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}.flow-model{font:600 12px var(--mono)}.flow-role{margin-top:5px;color:var(--sub);font-size:11px;line-height:1.4}.arrow{display:grid;place-items:center;color:var(--muted);font:13px var(--mono)}.flow-summary{margin-top:10px;color:var(--muted);font-size:11px}.background-card{min-width:220px}.background-label{color:var(--muted);font:10px var(--mono);letter-spacing:.08em;text-transform:uppercase}.background-status{margin-top:8px;font-size:12px}.background-detail{margin-top:5px;color:var(--muted);font-size:10px;line-height:1.45}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}.column{min-width:0}.column-head{display:flex;justify-content:space-between;align-items:end;margin:0 2px 10px}.column-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}.column-role{margin-top:3px;color:var(--muted);font-size:10px}.index{color:var(--muted);font:10px var(--mono)}.count{font:10px var(--mono);color:var(--muted)}
    .card{border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);box-shadow:0 1px 0 rgba(255,255,255,.02) inset}.prompt-card{margin-bottom:12px;overflow:hidden}.prompt-main{padding:15px}.prompt-top,.tool-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.model{font:600 15px var(--mono);letter-spacing:-.02em}.statusline{display:flex;align-items:center;gap:7px;margin-top:7px;color:var(--muted);font:11px var(--mono)}.status-dot{width:6px;height:6px;border-radius:50%;background:var(--muted)}.status-dot.active,.status-dot.ready,.status-dot.healthy,.status-dot.ok{background:var(--green)}.version{color:var(--muted);font:10px var(--mono);padding:4px 6px;border:1px solid var(--line2);border-radius:4px}.prompt-details{border-top:1px solid var(--line2)}summary{list-style:none;cursor:pointer;padding:10px 15px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between}summary::-webkit-details-marker{display:none}summary:after{content:"＋";font:12px var(--mono)}details[open] summary:after{content:"−"}.prompt-text{white-space:pre-wrap;word-break:break-word;margin:0;padding:2px 15px 14px;color:var(--sub);font:11px/1.65 var(--mono);max-height:360px;overflow:auto}.sources{padding:0 15px 13px;color:var(--muted);font:10px/1.5 var(--mono)}
    .section-label{display:flex;justify-content:space-between;margin:16px 2px 9px;color:var(--muted);font:10px var(--mono);letter-spacing:.09em;text-transform:uppercase}.tools{display:grid;gap:8px}.tool{padding:14px;overflow:hidden}.tool-id{font:600 12px/1.4 var(--mono);word-break:break-all}.tool-desc{color:var(--sub);font-size:12px;line-height:1.5;margin:9px 0 11px}.badges{display:flex;flex-wrap:wrap;gap:5px}.badge{border:1px solid var(--line);border-radius:999px;color:var(--muted);background:rgba(255,255,255,.02);padding:3px 7px;font:9px var(--mono);text-transform:uppercase}.badge.active{color:var(--green);border-color:rgba(62,207,142,.24);background:rgba(62,207,142,.06)}.badge.candidate{color:var(--amber);border-color:rgba(231,173,82,.25);background:rgba(231,173,82,.06)}.badge.risk-high,.badge.risk-critical{color:var(--red);border-color:rgba(239,107,115,.28)}.badge.risk-medium{color:var(--amber)}.evidence{margin-top:12px;padding-top:11px;border-top:1px solid var(--line2)}.evidence-row{display:flex;justify-content:space-between;color:var(--muted);font:9px var(--mono);margin-bottom:7px}.track{height:3px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}.fill{height:100%;background:var(--cyan);border-radius:3px}.stats{display:flex;gap:12px;margin-top:7px;color:var(--muted);font:9px var(--mono)}.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.btn{min-height:29px;padding:5px 9px;color:var(--sub);font-size:11px}.btn.primary{color:#dce9ff;border-color:rgba(109,159,245,.32);background:rgba(109,159,245,.09)}.btn.warn{color:#ffd98d;border-color:rgba(231,173,82,.28)}.btn.danger{color:#ff9ca3;border-color:rgba(239,107,115,.28)}.validation{margin-top:9px;padding:8px;border:1px solid rgba(62,207,142,.2);background:rgba(62,207,142,.05);border-radius:6px;color:var(--green);font:10px/1.5 var(--mono)}
    .lifecycle{margin-top:12px;padding:10px;border:1px solid var(--line);border-radius:7px;background:rgba(0,0,0,.12)}.life-head{display:flex;justify-content:space-between;color:var(--muted);font:9px var(--mono)}.life-head b{color:var(--green)}.versions{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:5px;margin:9px 0}.versions span{padding:7px;border:1px solid var(--line);border-radius:5px;color:var(--muted);font:9px var(--mono)}.versions .current{color:var(--green);border-color:rgba(62,207,142,.3)}.versions i{color:var(--muted);font:9px var(--mono)}.gates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.gate{padding:6px;border:1px solid var(--line);border-radius:5px}.gate b,.gate small{display:block;font:9px var(--mono)}.gate small{margin-top:3px;color:var(--muted)}.gate.passed{border-color:rgba(62,207,142,.25)}.gate.passed b{color:var(--green)}.gate.failed{border-color:rgba(239,107,115,.3)}.gate.failed b{color:var(--red)}.life-note{margin-top:8px;color:var(--muted);font:9px/1.45 var(--mono)}
    .empty,.state{border:1px dashed var(--line);border-radius:var(--radius);color:var(--muted);padding:28px 16px;text-align:center;font:11px/1.6 var(--mono)}.state{grid-column:1/-1;margin-top:70px}.error{color:var(--red)}
    .toast{position:fixed;right:20px;bottom:20px;z-index:20;max-width:min(380px,calc(100vw - 40px));padding:11px 13px;border:1px solid var(--line);background:#17191d;border-radius:8px;color:var(--sub);box-shadow:0 14px 40px rgba(0,0,0,.45);font-size:12px}.toast.bad{border-color:rgba(239,107,115,.3);color:#ffadb2}
    dialog{border:1px solid var(--line);border-radius:12px;padding:0;background:#121417;color:var(--text);box-shadow:0 28px 90px rgba(0,0,0,.72);width:min(400px,calc(100vw - 32px))}dialog::backdrop{background:rgba(0,0,0,.72)}.modal{padding:20px}.modal h2{font-size:15px;margin:0 0 7px}.modal p{color:var(--muted);font-size:12px;line-height:1.5;margin:0 0 14px}.token-input{width:100%;height:38px;background:#090a0c;border:1px solid var(--line);border-radius:6px;color:var(--text);padding:0 10px;font:12px var(--mono)}.modal-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:14px}
    @media(max-width:840px){.shell{padding:0 14px 32px}.topbar{height:auto;padding:16px 0}.topmeta .generated{display:none}.architecture{grid-template-columns:1fr}.flow{flex-direction:column}.arrow{transform:rotate(90deg)}.background-card{min-width:0}.grid{grid-template-columns:1fr;gap:24px}.column-head{position:sticky;top:0;z-index:4;background:rgba(8,9,10,.94);backdrop-filter:blur(10px);padding:10px 2px;margin:0}.prompt-card{margin-top:9px}}
    @media(prefers-reduced-motion:no-preference){.toast{animation:enter .15s ease-out}@keyframes enter{from{transform:translateY(5px);opacity:0}}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><div class="mark">JA</div><div><h1>Jarvis Runtime Dashboard</h1><div class="eyebrow">请求链路与能力归属</div></div></div>
      <div class="topmeta"><span class="generated" id="generated">等待数据</span><span class="sync"><i class="dot" id="syncDot"></i><span id="syncText">未连接</span></span><button class="iconbtn" id="refresh" title="刷新" aria-label="刷新">↻</button></div>
    </header>
    <section class="architecture" id="architecture" aria-live="polite"></section>
    <section class="grid" id="grid" aria-live="polite"><div class="state">正在读取运行状态…</div></section>
  </main>
  <dialog id="tokenDialog"><form class="modal" id="tokenForm"><h2>需要 API Token</h2><p>输入 Jarvis API Token。它只会保存在此浏览器的 localStorage 中。</p><input class="token-input" id="tokenInput" type="password" autocomplete="current-password" placeholder="Bearer token" required><div class="modal-actions"><button type="button" class="btn" id="tokenCancel">取消</button><button type="submit" class="btn primary">保存并重试</button></div></form></dialog>
  <div id="toastHost"></div>
<script>
(()=>{'use strict';
  const API='/v1/evolution/dashboard', KEY='jarvis_api_key';
  const grid=document.getElementById('grid'), refreshBtn=document.getElementById('refresh'), tokenDialog=document.getElementById('tokenDialog'), tokenInput=document.getElementById('tokenInput');
  const validations=new Map(); let prompting=false;
  const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const fmt=v=>{if(!v)return '—';const d=new Date(v);return isNaN(d)?String(v):new Intl.DateTimeFormat('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(d)};
  function toast(msg,bad=false){const el=document.createElement('div');el.className='toast'+(bad?' bad':'');el.textContent=msg;document.getElementById('toastHost').replaceChildren(el);setTimeout(()=>el.remove(),3600)}
  function askToken(){if(prompting)return;prompting=true;tokenInput.value='';tokenDialog.showModal();setTimeout(()=>tokenInput.focus(),0)}
  tokenDialog.addEventListener('close',()=>prompting=false);
  document.getElementById('tokenCancel').onclick=()=>tokenDialog.close();
  document.getElementById('tokenForm').onsubmit=e=>{e.preventDefault();localStorage.setItem(KEY,tokenInput.value.trim());tokenDialog.close();load()};
  async function request(url,options={},allowPrompt=true){
    const headers={'Accept':'application/json',...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})};const token=localStorage.getItem(KEY);if(token)headers.Authorization='Bearer '+token;
    const res=await fetch(url,{...options,headers});
    if(res.status===401&&allowPrompt){askToken();throw new Error('需要有效的 API Token');}
    let data=null;try{data=await res.json()}catch(_){data={}}
    if(!res.ok){const message=typeof data.error==='object'?data.error.message:data.error;throw new Error(data.detail||message||data.message||`请求失败 (${res.status})`)}return data;
  }
  function badge(text,cls=''){return `<span class="badge ${cls}">${esc(text)}</span>`}
  function promptCard(c){const p=c.prompt||{};const status=String(c.status||'unknown');const sources=Array.isArray(p.sources)?p.sources.join(' · '):(p.sources||'');return `<article class="card prompt-card"><div class="prompt-main"><div class="prompt-top"><div><div class="model">${esc(c.model||c.label||c.id)}</div><div class="statusline"><i class="status-dot ${esc(status.toLowerCase())}"></i>${esc(status)} · 更新 ${esc(fmt(p.updated_at))}</div></div><span class="version">${esc(p.version||'v—')}</span></div></div><details class="prompt-details"><summary>查看 Prompt 原文</summary><pre class="prompt-text">${esc(p.text||'暂无 Prompt')}</pre>${sources?`<div class="sources">来源 · ${esc(sources)}</div>`:''}</details></article>`}
  const tierNames={openclaw_only:'OPENCLAW','4b_eligible':'4B','08b_eligible':'0.8B'};
  const tierRank={openclaw_only:0,'4b_eligible':1,'08b_eligible':2};
  function toolCard(t){
    const active=!!t.active||t.status==='active', candidate=!!t.candidate||t.status==='candidate';const val=validations.get(String(t.id));
    let tags=badge(active?'生产启用':(t.status||'unknown'),active?'active':'')+(candidate?badge('有待验证变更','candidate'):'')+badge(`风险 ${t.risk||'—'}`,`risk-${String(t.risk||'').toLowerCase()}`)+badge(t.execution_kind||'execution —');
    if(t.executor)tags+=badge(`执行 ${t.executor}`);if(t.producer)tags+=badge(`产出 ${t.producer}`);(Array.isArray(t.domain_tags)?t.domain_tags:[]).forEach(x=>tags+=badge(x));
    let candidateBlock='';
    if(candidate){let actions=`<button class="btn primary" data-action="validate" data-id="${esc(t.id)}" data-version="${esc(t.candidate_version)}">验证待应用版本</button>`;if(val?.passed)actions+=`<button class="btn warn" data-action="promote" data-id="${esc(t.id)}">应用已验证版本</button>`;actions+=`<button class="btn danger" data-action="discard" data-id="${esc(t.id)}">撤销待应用版本</button>`;candidateBlock=`<div class="evidence"><div class="evidence-row"><span>待应用变更</span><span>v${esc(t.candidate_version||'—')} · 目标 ${esc(tierNames[t.candidate_target_tier]||t.candidate_target_tier||'—')}</span></div><div class="stats"><span>${Number(t.candidate_evidence_count)||0} 条验证证据</span></div></div>${val?`<div class="validation">验证通过 · report ${esc(String(val.report_hash||'').slice(0,12))}</div>`:''}<div class="actions">${actions}</div>`}
    const life=t.lifecycle||{}, validation=life.validation||{}, previous=Array.isArray(life.previous_versions)&&life.previous_versions.length?life.previous_versions.map(v=>'v'+v).join(' · '):'无历史版本';
    const labels={replay:'Replay回放',dangerous_negatives:'危险负例',shadow:'Shadow对照',security:'Security安全检查'};const gates=Array.isArray(validation.gates)?validation.gates:[];
    const gateHtml=gates.map(g=>`<span class="gate ${esc(g.status||'not_run')}"><b>${esc(g.label||labels[g.key]||g.key)}</b><small>${g.status==='passed'?'已通过':g.status==='failed'?'未通过':'尚未运行'}</small></span>`).join('');
    const lifeBlock=`<section class="lifecycle"><div class="life-head"><span>EVOLUTION TRACE</span><b>${candidate?'Candidate验证中':life.stage==='active'?'已验证应用':'积累证据'}</b></div><div class="versions"><span>PREVIOUS<br>${esc(previous)}</span><i>→</i><span class="current">ACTIVE<br>v${esc(life.active_version||t.version||0)}</span><i>→</i><span>CANDIDATE<br>${candidate?'v'+esc(life.candidate_version||t.candidate_version):'尚未产生'}</span></div><div class="gates"><span class="gate"><b>真实证据</b><small>${Number(t.evidence_count)||0} turns · ${Number(t.days_count)||0} 天 · ${Number(t.expressions_count)||0} 表达</small></span>${gateHtml}<span class="gate ${candidate?'not_run':'passed'}"><b>Active</b><small>${candidate?'等待验证后应用':'生产版本 v'+esc(t.version||0)}</small></span></div><div class="life-note">${validation.checked_at?'最近验证 '+esc(fmt(validation.checked_at))+' · report '+esc(validation.report||'—'):'尚无持久化验证报告；未运行的安全门不会显示为通过。'}</div></section>`;
    return `<article class="card tool"><div class="tool-top"><div class="tool-id">${esc(t.id)}</div><span class="version">v${esc(t.version||0)}</span></div><div class="tool-desc">${esc(t.description||'暂无说明')}</div><div class="badges">${tags}</div>${lifeBlock}${candidateBlock}</article>`}
  function backgroundState(last){
    if(!last||typeof last!=='object'||!Object.keys(last).length)return {status:'尚无后台演进记录',detail:'没有待验证变更，不影响当前生产链路。'};
    const candidates=Number(last.capability_candidate_count)||0;const discovery=Number(last.quick_tool_discovery_count)||0;const l1=last.level1||{};
    if(candidates===0&&l1.status==='skipped')return {status:'无需运行验证',detail:`当前没有Candidate；能力发现 ${last.quick_tool_discovery_status||'未运行'}，发现 ${discovery} 项。`};
    if(last.status==='ok')return {status:'后台演进正常',detail:`Candidate ${candidates} 项 · 新发现 ${discovery} 项。`};
    return {status:'后台演进需关注',detail:String(last.reason||l1.reason||last.status||'状态未知')};
  }
  function render(data){
    const order=['0.8B','4B','OPENCLAW'], cols=Array.isArray(data.columns)?data.columns:[];const rank=c=>{const hay=`${c.id} ${c.label} ${c.model}`.toUpperCase();const i=order.findIndex(x=>hay.includes(x));return i<0?99:i};cols.sort((a,b)=>rank(a)-rank(b));
    const bg=backgroundState(data.last_run), arch=data.architecture||{};const flow=cols.map((c,i)=>`${i?'<span class="arrow">→</span>':''}<div class="flow-step"><div class="flow-model">${esc(c.label||c.id)}</div><div class="flow-role">${esc(c.role||'运行节点')}</div></div>`).join('');document.getElementById('architecture').innerHTML=`<article class="card flow-card"><div class="flow-title">${esc(arch.title||'当前请求处理链')}</div><div class="flow">${flow}</div><div class="flow-summary">${esc(arch.summary||'')}</div></article><article class="card background-card"><div class="background-label">演进后台状态</div><div class="background-status">${esc(bg.status)}</div><div class="background-detail">${esc(bg.detail)}</div></article>`;
    document.getElementById('generated').textContent=`数据更新 ${fmt(data.generated_at)}`;document.getElementById('syncDot').className='dot ok';document.getElementById('syncText').textContent='生产数据已同步';
    grid.innerHTML=cols.map((c,i)=>{const tools=Array.isArray(c.tools)?c.tools:[];return `<section class="column"><div class="column-head"><div><div class="column-title"><span class="index">0${i+1}</span>${esc(c.label||c.id)}</div><div class="column-role">${esc(c.role||'')}</div></div><span class="count">${tools.length} CAPABILITIES</span></div>${promptCard(c)}<div class="section-label"><span>当前能力归属</span><span>${tools.filter(t=>t.active).length} 生产启用</span></div><div class="tools">${tools.length?tools.map(toolCard).join(''):'<div class="empty">该节点当前没有独立能力包</div>'}</div></section>`}).join('')||'<div class="state">当前没有可展示的运行节点</div>';
  }
  async function load(){refreshBtn.disabled=true;document.getElementById('syncText').textContent='同步中';try{render(await request(API))}catch(e){document.getElementById('syncDot').className='dot';document.getElementById('syncText').textContent='连接失败';if(!prompting)grid.innerHTML=`<div class="state error">${esc(e.message)}<br><button class="btn" style="margin-top:12px" data-action="reload">重试</button></div>`}finally{refreshBtn.disabled=false}}
  async function mutate(label,url,body,method='POST'){try{await request(url,{method,body:JSON.stringify(body||{})});toast(label+'成功');await load()}catch(e){toast(e.message,true)}}
  grid.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action,id=b.dataset.id,base=`/v1/evolution/capabilities/${encodeURIComponent(id||'')}`;if(action==='reload')return load();
    if(action==='tier'){const target=tierNames[b.dataset.tier]||b.dataset.tier;const reason=prompt(`请输入将 ${id} 调整至 ${target} 的原因：`);if(!reason)return;if(!confirm(`确认创建层级变更 Candidate？\n${id} → ${target}\n此时不会立即改变Active。`))return;return mutate('层级提案',base+'/tier',{target_tier:b.dataset.tier,reason})}
    if(action==='rollback'){if(!confirm(`确认回滚 ${id}？\n该操作可能立即改变线上行为。`))return;return mutate('回滚',base+'/rollback',{})}
    if(action==='validate'){b.disabled=true;b.textContent='验证中…';try{const r=await request(base+'/validate',{method:'POST',body:'{}'});const report=r.report||r.validation||r;const passed=report.passed===true||report.status==='passed'||r.passed===true;if(!passed)throw new Error(report.message||report.reason||'验证未通过');validations.set(String(id),{passed:true,report_hash:report.report_hash||r.report_hash,expected_version:Number(b.dataset.version)});toast('验证通过');await load()}catch(err){toast(err.message,true);b.disabled=false;b.textContent='运行验证'}return}
    if(action==='promote'){const v=validations.get(String(id));if(!v?.passed)return toast('请先运行并通过验证',true);if(!v.report_hash||!v.expected_version)return toast('验证响应不完整，无法应用',true);if(!confirm(`确认应用 ${id} 的 Candidate？\n此操作会改变线上层级，但可以回滚。`))return;return mutate('Candidate应用',base+'/promote',{expected_version:v.expected_version,report_hash:v.report_hash})}
    if(action==='discard'){const reason=prompt(`请输入撤销 ${id} Candidate 的原因：`);if(!reason)return;if(!confirm(`确认撤销 ${id} 的Candidate？\nActive不会改变。`))return;validations.delete(String(id));return mutate('Candidate撤销',base+'/candidate',{reason},'DELETE')}
  });
  refreshBtn.onclick=load;load();
})();
</script>
</body>
